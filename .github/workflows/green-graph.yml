name: 🟩 Green Graph - Dark Mode (Max Contributions)

on:
  schedule:
    # 8 baar chalega daily — DARKEST green guaranteed!
    - cron: '10 2 * * *'    # 7:40 AM IST
    - cron: '30 4 * * *'    # 10:00 AM IST
    - cron: '0 7 * * *'     # 12:30 PM IST
    - cron: '30 9 * * *'    # 3:00 PM IST
    - cron: '0 11 * * *'    # 4:30 PM IST
    - cron: '30 13 * * *'   # 7:00 PM IST
    - cron: '0 15 * * *'    # 8:30 PM IST
    - cron: '30 17 * * *'   # 11:00 PM IST
  workflow_dispatch: # Manual bhi chala sakte ho

permissions:
  contents: write

jobs:
  green-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟩 Generate dark green commits
        run: |
          git config user.name "Azad Ansari"
          git config user.email "ansariazad@users.noreply.github.com"

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DAY_OF_WEEK=$(date +%u)
          RUN_ID=$RANDOM

          # Weekend pe thoda kam (natural dikhta hai)
          if [ "$DAY_OF_WEEK" -ge 6 ]; then
            # 25% chance skip on weekends
            if [ $((RANDOM % 100)) -lt 25 ]; then
              echo "⏭️ Weekend skip (natural pattern)"
              exit 0
            fi
          fi

          # Multiple files update karo — zyada realistic
          # 1. Activity log
          echo "[$TIMESTAMP] run:$RUN_ID — development session active" >> activity.log

          # 2. Progress tracker
          LINES=$(wc -l < activity.log 2>/dev/null || echo "0")
          cat > data.txt << EOF
          Last Active: $TIMESTAMP
          Total Sessions: $LINES
          Run ID: $RUN_ID
          Current Streak: Active
          Focus: Full Stack + Security
          Status: Building & Learning 🔥
          EOF

          # 3. Green graph log (rotating — keeps last 500 lines)
          echo "[$TIMESTAMP] commit #$LINES — graph contribution" >> green_graph.log
          tail -500 green_graph.log > green_graph.tmp && mv green_graph.tmp green_graph.log

          # 4. Random project notes update
          TOPICS=("react" "python" "security" "devops" "api" "database" "frontend" "backend" "testing" "deployment")
          TOPIC=${TOPICS[$((RANDOM % ${#TOPICS[@]}))]}
          echo "[$TIMESTAMP] Studying: $TOPIC — notes updated" >> study_log.md

          # Commit messages pool — looks like real dev work
          MESSAGES=(
            "refactor: improve code structure"
            "chore: update project configs"
            "docs: update documentation"
            "fix: resolve edge case handling"
            "feat: add utility function"
            "style: improve code formatting"
            "test: add test coverage"
            "perf: optimize performance"
            "build: update dependencies"
            "ci: improve workflow"
            "chore: daily maintenance"
            "docs: update README notes"
            "refactor: clean up modules"
            "fix: patch minor issues"
            "feat: enhance logging"
            "style: consistent formatting"
            "chore: sync project files"
            "docs: add inline comments"
            "refactor: simplify logic"
            "fix: handle null checks"
            "feat: add helper functions"
            "fix: improve error handling"
            "docs: update API docs"
            "chore: clean up codebase"
            "test: improve test reliability"
            "perf: reduce memory usage"
            "feat: add new module"
            "refactor: extract common logic"
            "fix: correct validation rules"
            "style: apply linter fixes"
          )

          MSG_INDEX=$((RANDOM % ${#MESSAGES[@]}))
          COMMIT_MSG="${MESSAGES[$MSG_INDEX]}"

          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "$COMMIT_MSG"
          git push

          echo "✅ Committed: $COMMIT_MSG (session $LINES)"
